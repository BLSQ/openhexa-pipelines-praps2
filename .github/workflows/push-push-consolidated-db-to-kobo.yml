name: Push "push consolidated DB to Kobo" pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/push-push-consolidated-db-to-kobo.yml"
      - "push_consolidated_db_to_kobo/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Configure OpenHEXA CLI
        uses: blsq/openhexa-cli-action@v1
        with:
          workspace: "praps-f5e786"
          token: ${{ secrets.OH_TOKEN }}
      - name: Push pipeline to OpenHEXA
        run: |
          openhexa pipelines push push_consolidated_db_to_kobo \
            -c pousser-la-db-consolidee-vers-kobo \
            -n ${{ github.sha }} \
            -l "https://github.com/BLSQ/openhexa-pipelines-praps2/commit/${{ github.sha }}" \
            --yes
